# release-plz (ADR 0007), on every push to `main`:
# - `release-pr` opens or updates the release PR (version bump + CHANGELOG.md).
# - `release` publishes to crates.io and pushes the `vX.Y.Z` tag, but only when the pushed
#   commit is a merged release PR (`release_always = false` in release-plz.toml).
#
# Both jobs act with the `RELEASE_PLZ_TOKEN` fine-grained PAT, not `GITHUB_TOKEN`: a PR or tag
# created with `GITHUB_TOKEN` does not trigger workflows, so the required `ci` check would never
# run on the release PR and the tag would not start release.yml (dist) or pypi.yml.
#
# Never runs on pull requests, so no secret reaches PR-triggered code.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: release
    if: github.repository == 'davidfierro/snowflake-cli-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io trusted publishing: the OIDC token is exchanged for a short-lived crates.io token.
      id-token: write
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # The first publish uses the temporary CARGO_REGISTRY_TOKEN secret (trusted publishing can
      # only be configured once the crate exists). Once that secret is deleted, this step mints a
      # short-lived token through trusted publishing instead.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
        if: env.HAS_CARGO_REGISTRY_TOKEN != 'true'
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-io-auth.outputs.token }}

  release-pr:
    name: release PR
    if: github.repository == 'davidfierro/snowflake-cli-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One release-PR update at a time; a newer push must not cancel one half-way.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
